<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="My Internet Museum — 跨平台个人内容收藏与整理工具。" />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="My Internet Museum" />
    <meta property="og:description" content="一个可交互体验的跨平台个人内容收藏与整理工具。" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://my-internet-museum.vercel.app/" />
    <link rel="canonical" href="https://my-internet-museum.vercel.app/" />
    <meta name="theme-color" content="#fbfaf7" />
    <title>My Internet Museum</title>
    <link rel="icon" href="assets/avatar.webp" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#museum" aria-label="My Internet Museum 首页">
        <img src="assets/avatar.webp" alt="My Internet Museum 女孩头像" />
        <span>My Internet Museum</span>
      </a>

      <nav class="main-nav" aria-label="主要导航">
        <button class="nav-link is-active" type="button" data-route="museum">Museum</button>
        <button class="nav-link" type="button" data-route="collections">Collections</button>
        <button class="nav-link" type="button" data-route="tags">Tags</button>
      </nav>

      <div class="header-actions">
        <button class="icon-button" id="focus-search" type="button" aria-label="搜索">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
        </button>
        <button class="icon-button" id="favorites-filter" type="button" aria-label="只看 Favorite" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4.5h12v16l-6-4-6 4z"></path></svg>
        </button>
        <img class="profile-avatar" src="assets/avatar.webp" alt="个人头像" />
      </div>
    </header>

    <main id="app" tabindex="-1">
      <section class="route is-active" id="museum-view" data-route-view="museum">
        <div class="museum-toolbar shell">
          <aside class="demo-notice" aria-label="Demo 体验说明">
            <span><strong>Demo 体验模式</strong> 你可以自由新增、编辑和删除；所有变化只保存在当前浏览器。</span>
            <button class="text-button" id="reset-demo" type="button">恢复 5 条示例</button>
          </aside>
          <div class="universal-input-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
            <input id="universal-input" type="search" autocomplete="off" placeholder="搜索 Museum，或粘贴一个链接…" aria-label="搜索 Museum 或粘贴链接" />
            <span class="input-hint" id="input-hint">⌘ K</span>
            <button class="clipboard-button" id="paste-and-collect" type="button">粘贴并收藏</button>
          </div>

          <div class="filter-bar">
            <div class="tag-shortcuts" id="tag-shortcuts" aria-label="Collections 快捷筛选"></div>
            <div class="filter-actions">
              <label class="platform-filter">
                <span class="sr-only">Platform 筛选</span>
                <select id="platform-filter">
                  <option value="all">全部平台</option>
                  <option value="小红书">小红书</option>
                  <option value="Bilibili">Bilibili</option>
                  <option value="抖音">抖音</option>
                  <option value="微信公众号">公众号</option>
                  <option value="Website">Website</option>
                </select>
              </label>
              <button class="primary-button" id="add-exhibit" type="button"><span>＋</span> 添加 Exhibit</button>
            </div>
          </div>
        </div>

        <div class="shell museum-content" id="tag-sections" aria-live="polite"></div>
      </section>

      <section class="route shell" id="collections-view" data-route-view="collections" hidden>
        <div class="page-heading">
          <div>
            <p class="eyebrow">Your exhibition rooms</p>
            <h1>Collections <span id="collection-count"></span></h1>
          </div>
          <button class="primary-button" id="new-collection" type="button"><span>＋</span> 新建 Collection</button>
        </div>
        <div class="collection-grid" id="collection-grid"></div>
      </section>

      <section class="route shell" id="tags-view" data-route-view="tags" hidden>
        <div class="page-heading tags-heading">
          <div>
            <p class="eyebrow">Your own vocabulary</p>
            <h1>Tags</h1>
          </div>
          <div class="page-actions">
            <button class="secondary-button" id="batch-manage-tags" type="button">批量管理</button>
            <button class="primary-button" id="new-tag" type="button"><span>＋</span> 新建 Tag</button>
          </div>
        </div>
        <div class="batch-toolbar" id="tag-batch-toolbar" hidden>
          <span id="tag-batch-count">已选择 0 个 Tag</span>
          <div>
            <button class="text-button" id="select-all-tags" type="button">全选</button>
            <button class="text-button" id="cancel-tag-batch" type="button">取消</button>
            <button class="secondary-button danger-outline-button" id="delete-selected-tags" type="button" disabled>删除已选 Tag</button>
          </div>
        </div>
        <div class="tags-layout">
          <aside class="tag-index" id="tag-index" aria-label="Tag 列表"></aside>
          <div class="tag-results">
            <div class="tag-results-heading">
              <div>
                <p class="eyebrow">选中的 Tag</p>
                <h2 id="selected-tag-title">#AI工具</h2>
              </div>
              <span id="selected-tag-count"></span>
            </div>
            <div class="exhibit-grid exhibit-grid--three" id="tag-result-grid"></div>
          </div>
        </div>
      </section>
    </main>

    <dialog class="panel-dialog" id="exhibit-form-dialog">
      <form id="exhibit-form" method="dialog">
        <div class="dialog-header">
          <div>
            <p class="eyebrow">New acquisition</p>
            <h2 id="form-title">添加 Exhibit</h2>
          </div>
          <button class="icon-button close-dialog" type="button" aria-label="关闭">×</button>
        </div>

        <div class="form-layout">
          <div class="form-fields">
            <input type="hidden" id="exhibit-id" />
            <label class="field">
              <span>URL</span>
              <textarea id="exhibit-url" rows="2" required placeholder="粘贴链接，或包含链接的整段分享文字"></textarea>
              <small id="url-feedback">粘贴后会自动识别 Platform。</small>
            </label>

            <div class="field-row">
              <label class="field">
                <span>Platform</span>
                <select id="exhibit-platform" required>
                  <option>小红书</option>
                  <option>Bilibili</option>
                  <option>抖音</option>
                  <option>微信公众号</option>
                  <option>Website</option>
                </select>
              </label>
              <label class="field">
                <span>Collection</span>
                <input id="exhibit-collection" list="collection-options" placeholder="例如 AI Learning" />
                <datalist id="collection-options"></datalist>
              </label>
            </div>

            <label class="field">
              <span>Title</span>
              <input id="exhibit-title-input" required placeholder="这条内容叫什么？" />
            </label>

            <label class="field">
              <span>Tags</span>
              <div class="tag-editor">
                <div class="selected-tag-chips" id="selected-tag-chips" aria-live="polite"></div>
                <div class="tag-entry-row">
                  <input id="exhibit-tag-input" list="tag-options" placeholder="输入或选择一个 Tag" />
                  <datalist id="tag-options"></datalist>
                  <button class="secondary-button" id="add-tag-to-exhibit" type="button">＋ 添加</button>
                </div>
              </div>
              <small>Tag 完全由你管理；不添加也可以正常保存。</small>
            </label>

            <label class="field">
              <span>Why I Saved This</span>
              <textarea id="exhibit-why" rows="4" placeholder="为什么值得收藏？"></textarea>
            </label>

            <label class="favorite-check">
              <input id="exhibit-favorite" type="checkbox" />
              <span>加入 Favorite</span>
            </label>
          </div>

          <aside class="cover-editor">
            <div class="cover-preview" id="cover-preview">
              <img id="cover-preview-image" alt="封面预览" hidden />
              <div id="cover-preview-placeholder">
                <span class="cover-preview-number">MIM</span>
                <strong id="cover-preview-label">NEW<br />EXHIBIT</strong>
              </div>
            </div>
            <div class="cover-actions">
              <label class="secondary-button upload-button">
                上传封面
                <input id="cover-file" type="file" accept="image/*" hidden />
              </label>
              <button class="secondary-button" id="fetch-cover" type="button">抓取原封面</button>
              <button class="secondary-button" id="generate-cover" type="button">生成排版封面</button>
              <button class="text-button" id="clear-cover" type="button">清除图片</button>
            </div>
            <p class="cover-note">粘贴链接后会优先抓取公开封面；抓取失败时自动使用统一排版封面。你也可以随时上传替换。</p>
          </aside>
        </div>

        <div class="dialog-footer">
          <button class="secondary-button close-dialog" type="button">取消</button>
          <button class="primary-button" type="submit">Add to Museum</button>
        </div>
      </form>
    </dialog>

    <dialog class="detail-dialog" id="detail-dialog">
      <article id="detail-content"></article>
    </dialog>

    <dialog class="mini-dialog" id="collection-dialog">
      <form id="collection-form" method="dialog">
        <div class="dialog-header">
          <h2>新建 Collection</h2>
          <button class="icon-button close-collection-dialog" type="button" aria-label="关闭">×</button>
        </div>
        <label class="field">
          <span>Collection name</span>
          <input id="new-collection-name" required placeholder="例如 Design Inspiration" />
        </label>
        <div class="dialog-footer">
          <button class="secondary-button close-collection-dialog" type="button">取消</button>
          <button class="primary-button" type="submit">创建</button>
        </div>
      </form>
    </dialog>

    <dialog class="mini-dialog" id="tag-dialog">
      <form id="tag-form" method="dialog">
        <div class="dialog-header">
          <div>
            <p class="eyebrow">Manual organization</p>
            <h2 id="tag-dialog-title">新建 Tag</h2>
          </div>
          <button class="icon-button close-tag-dialog" type="button" aria-label="关闭">×</button>
        </div>
        <input id="original-tag-name" type="hidden" />
        <label class="field">
          <span>Tag name</span>
          <input id="tag-name" required placeholder="例如 设计灵感" />
        </label>
        <div class="dialog-footer">
          <button class="secondary-button close-tag-dialog" type="button">取消</button>
          <button class="primary-button" type="submit">保存 Tag</button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="app.js"></script>
  </body>
</html>
